name: Update Backend Deployment Status

on:
  push:
    branches:
      - main

jobs:
  update-deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://sprinthub-backend-mlw8.onrender.com

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
